<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="theme-color" content="#6b4f2a" />

    <title>Tanakh Similarity</title>
    <script>
      // the interface language before the first paint (context/Locale.tsx owns the key)
      try {
        if (localStorage.getItem('bsim.locale') === 'he') {
          document.documentElement.lang = 'he'
          document.documentElement.dir = 'rtl'
        }
      } catch {}
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
