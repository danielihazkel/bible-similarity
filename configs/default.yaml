etcbc:                        # `bsim eval-etcbc`: ETCBC parallel passages as a third gold set, dev only (DESIGN.md §16.34)
  bands: [[75, 84], [85, 94], [95, 100]]   # similarity bands (percent) for the fused recall@10
  max_partners: 5             # a pair is a parallel when both verses have at most this many partners (else a formula)
  max_q: 0.05                 # a strong sequence (coverage)

pipeline:                     # `bsim all` (stage order fixed in bsim/pipeline.py)
  download_workers: 8
  lexical_systems: [bm25_lemma, bm25_surface, bm25_morph, bm25_domain, bm25_syntax]   # verse top-k before training (hard negatives) + the domain list
  csls: true                  # also top-k `{system}_csls` for every encoders.systems entry
  unit_systems: [tfidf, tfidf_morph, tfidf_domain, tfidf_syntax, berel_mean, berel_sup, berel_sup_csls, bge_m3_csls]   # `bsim units`
  roots: [data_raw, data_interim, data_processed, models, artifacts]   # `paths` keys whose files are stage inputs and outputs (incremental runs, §16.35)
  ignore: ["models/_runs/*", "*.tmp", "*-journal", "*-wal", "*-shm"]   # never a stage input or output (training checkpoints, SQLite side files)

store:                        # `bsim build-db` -> paths.db (DESIGN.md §9)
  batch_rows: 200000          # rows per executemany batch
  max_size_mb: 4096           # warn when results.sqlite is larger (4 GB; 530 MB with 5 modes + analyses)
  bench_queries: 20           # timed /similar runs per spot-check verse and mode (target < 10 ms)
  discoveries:
    max_rank: 10              # unlinked pair kept when either unit ranks the other within this

compare_builds:               # `bsim compare-builds OLD NEW`: what changed between two results DBs (DESIGN.md §16.49)
  float_tol: 1.0e-9           # REAL columns: relative difference (absolute below 1) not counted as a change beyond it
  examples: 5                 # differing keys / meta paths shown per table
  volatile_meta: [built_at, similar_benchmark]   # meta keys that differ between any two builds (the build time, /similar timings), reported apart

serve:                        # `bsim serve` (DESIGN.md §10)
  domains:                    # /unit-domains: a unit's themes (DESIGN.md §16.22)
    top: 12                   # most over-represented domains listed
    min_weight: 2             # content words a domain needs in the unit to be listed
  host: 127.0.0.1
  port: 8000
  labels_writable: true       # PUT / DELETE /api/labels (false: the viewer shows labels read-only)
  device: cuda                # query encoder + hubness; falls back to cpu if unavailable
  cors_origins: ["http://localhost:5173", "http://127.0.0.1:5173"]   # Vite dev server
  default_k: 10
  preview_chars: 200          # /similar: first-verse preview of chapter / pericope / parasha hits
  max_page: 200               # largest `limit` of paginated endpoints (/discoveries)
  export_max_rows: 20000      # /export/{list}.csv: rows written at most
  cache_dir: api              # under paths.artifacts: CSLS hubness + surface BM25 caches for /search
  max_compare_verses: 300     # /compare refuses units longer than this (each side)
  structure_cache: 256        # /structure/{unit}: responses kept in memory (LRU; deterministic)
  gzip_min_bytes: 1000        # responses at least this large are gzip-compressed
  api_max_age: 300            # Cache-Control max-age (s) of GET /api responses (data is read-only)
  sqlite_cache_mb: 64         # per-connection page cache; the DB file is also memory-mapped
  sqlite_pool: 4              # idle read-only connections kept between requests (keeps their cache)
  encoder_retry_s: 5          # Retry-After of a semantic /search sent while the encoder still loads
  sequence_cache: 256         # /sequences/{id}: responses kept in memory (LRU; deterministic)
  max_arcs: 2000              # /sequences/arcs: the most chains drawn across the canon (strongest first)
  dossier_cache: 1024         # /dossier/{unit}: responses kept in memory (LRU; labels are read live)
  dossier:                    # /dossier/{unit}: what the analyses say about one unit (DESIGN.md §10)
    max_q: 0.05               # acrostic / structure q counted as found; type scenes listed at this q
    meter_pct: 0.9            # a chapter's lines fall like a lament at or above this share of the poetry pool
  refrain_verses: 3           # /refrains/list: verses shown in full per refrain (the rest as references)
  list_verses: 3              # /forms/lists: a list's first verses shown in full
  notebook:                   # /notebook: your bookmarks, notes and collections, in the labels file (DESIGN.md §16.47)
    max_note: 20000           # characters of a note or a collection's description
    max_name: 80              # characters of a collection's name
  patterns:                   # /patterns: pattern search over the words (DESIGN.md §16.46)
    max_patterns: 8           # word patterns in one query
    max_matches: 2000000      # partial matches at any step; a broader query is refused (too_broad)
    cache: 64                 # queries whose matches are kept
    preload: true             # build the word table in the background when the server starts
  workbench:                  # /workbench: your sets contrasted and checked (DESIGN.md §16.64)
    max_items: 24             # items in one set
    max_chars: 2000           # characters in one set
    min_count: 5              # a value is scored when A and B hold at least this many words of it
    alpha: 0.05               # q at or below: counted as significant
    rows: 30                  # values listed per side by default
    max_rows: 200
    examples: 3               # verses shown per value
    draws: 999                # shuffles of a check
    max_draws: 9999
    seed: 23
    cache: 32                 # contrasts and checks kept
  places:                     # /places/{id}: a place's panel (DESIGN.md §16.57)
    partners: 15              # places named in the same verses, most shared first
  reader:                     # /reader/{unit}: the layered reader (DESIGN.md §16.39)
    rare_verses: 3            # a word is rare when its rarest content word is in at most this many verses (names out)
  findings:                   # /findings: the headline result of each analysis (DESIGN.md §10)
    alpha: 0.05               # a test at or below this p (or q) counts as holding
  search:
    min_root_letters: 2       # greedy prefix stripping keeps at least this many letters
    bigrams: true             # surface BM25 also indexes adjacent-token bigrams
    max_query_chars: 500
    max_k: 200                # /search returns at most this many verses (ranked past retrieval.k)
    query_cache: 256          # query embeddings kept in memory (LRU) for repeated searches
