    - {span: Psalms, unit: verse, ref: "Psalms 78:38", source: talmud}
  books:                      # the Masorah's verse total of each of its books (first and last of ours); `also`: other totals the manuscripts give; `reason` (explained by the viewer) and `ref` for a total ours differs from
    - {books: [Genesis], verses: 1534, reason: split, ref: "Genesis 35:22"}   # counted as two verses
    - {books: [Exodus], verses: 1209, reason: decalogue, ref: "Exodus 20:2-14"}   # 12 verses there, 13 in MAM
    - {books: [Leviticus], verses: 859}
