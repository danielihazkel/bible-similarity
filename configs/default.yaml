# Every tunable value lives here (DESIGN.md §12). Artifacts record a hash of the sections they depend on.

seed: 13

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  artifacts: artifacts
  db: artifacts/results.sqlite
  labels: data/labels.sqlite  # your judgements of pairs, written by the viewer (DESIGN.md §16.25)
  pipeline_state: artifacts/pipeline_state.json   # `bsim all`: each stage's code, config, input and output hashes (DESIGN.md §16.35)
  web_dist: web/dist          # production viewer build (`npm run build` in web/), served by `bsim serve`

sources:
  oshb:
    repo: openscriptures/morphhb
    commit: 3d15126fb1ef74867fc1434be1942e837932691f   # master @ 2024-08-27
    raw_url: https://raw.githubusercontent.com/openscriptures/morphhb/{commit}/wlc/{osis}.xml
  sefaria:
    bucket: sefaria-export    # public GCS bucket
    text_version: Miqra according to the Masorah
    text_path: "json/Tanakh/{section}/{book}/Hebrew/{version}.json"
    schema_path: "schemas/{slug}.json"     # slug = title with spaces -> underscores
    links_prefix: links/links
    links_regex: '^links/links\d+\.csv$'   # links0.csv .. linksN.csv (17 files in 2026-10)
  sdbh:                       # UBS Dictionary of Biblical Hebrew (SDBH), CC BY-SA 4.0: senses, domains, word references
    repo: ubsicap/ubs-open-license
    commit: 33dcc8c671511151551804e073f1d461bc5d5b1a   # main @ 2026-09-22 (v0.9.3)
    raw_url: https://raw.githubusercontent.com/ubsicap/ubs-open-license/{commit}/dictionaries/hebrew/JSON/{file}
    files: [UBSHebrewDic-v0.9.3-en.JSON, UBSHebrewDicLexicalDomains-v0.9.3-en.JSON]
  hebrew_lexicon:             # OpenScriptures HebrewLexicon, CC BY 4.0: Strong's parts of speech (names)
    repo: openscriptures/HebrewLexicon
    commit: 21c9add13bc727d3a951361778e97e3ff7afd1ce   # master @ 2019-09-02
    raw_url: https://raw.githubusercontent.com/openscriptures/HebrewLexicon/{commit}/{file}
    files: [HebrewStrong.xml]
  bhsa:                       # ETCBC BHSA (Text-Fabric), CC BY-NC 4.0: clauses, phrases and their functions (DESIGN.md §16.26)
    repo: ETCBC/bhsa
    commit: 4db00e2157915495e1a4d3d57e41223df24775da   # master @ 2026-01-18 (data version 2021)
    raw_url: https://raw.githubusercontent.com/ETCBC/bhsa/{commit}/tf/2021/{file}
    # node types and slots, the verse grid, word consonants and lexemes, clause and phrase
    # features; no glosses (D5)
    files: [otype.tf, oslots.tf, book.tf, chapter.tf, verse.tf, g_cons_utf8.tf, lex.tf, sp.tf,
            typ.tf, kind.tf, domain.tf, txt.tf, function.tf, rela.tf, mother.tf, vt.tf, ps.tf,
            gn.tf, nu.tf, prs.tf, prs_ps.tf, prs_gn.tf, prs_nu.tf]
  etcbc_parallels:            # ETCBC parallels notebook (Text-Fabric), CC BY-NC 4.0: near-verbatim verse pairs (DESIGN.md §16.34)
    repo: ETCBC/parallels
    commit: d0b3b42ab79b35d1ef349bda9dc1e62b2a56486e   # master @ 2023-11-13 (data version 2021)
    raw_url: https://raw.githubusercontent.com/ETCBC/parallels/{commit}/tf/2021/{file}
    files: [crossref.tf]

lexicon:                      # `bsim lexicon`: SDBH senses and domains per word, Strong's name types (DESIGN.md §16.22)
  search_window: 2            # an SDBH word reference may sit this many morphemes off OSHB's count
  ambiguous: split            # untagged morpheme whose lemma has meanings in several domains: split (weights) | skip

syntax:                       # `bsim syntax`: BHSA clauses and phrases on OSHB words (DESIGN.md §16.26)
  infinitive_hop: [">MR["]    # an introduction through this infinitive (לאמר) is followed to the clause it depends on
  speaker_lookback: 3         # clauses at its level looked back over for the subject of a subjectless introduction (ויאמר)
  divine: ["3068", "430", "136"]   # speaker lemmas counted as God (יהוה, אלהים, אדני)
  speaker_domains: ["001001", "003001004", "003001007"]   # SDBH senses that can speak: Beings, Names of Deities, Names of People
  system: bm25_syntax         # clause-shape verse list behind "built the same way" (also the syntax mode)
  neighbors: 10               # of it, kept per verse in the DB
  speech_speakers: 3          # /speech: speakers listed per book
  pass_through: ["1121"]      # a subject head passed over for a later speaker in its phrase (בני ישראל -> ישראל)
  addressee_preps: [">L", "L"]          # an introduction's complement opened by these names the addressee (אל, ל)
  addressee_object_verbs: ["YWH["]      # ... and so does the object of these verbs (צוה)
  addressee_pass_through: ["1121", "113", "1004", "5650"]   # addressee heads passed over for a later one (בני ישראל, אדני המלך, בית ישראל, עבדך דוד)
  addressee_turn_gap: 4       # clauses between a quotation's end and the next introduction for them to be one conversation

text:
  kq: qere                    # qere | ketiv — reading used for text_model
  max_seq_length: 128         # verify against the longest verse in M2

corpus:
  min_alignment_coverage: 0.99   # share of OSHB words aligned to a MAM display token
  expected: {verses: 23206, chapters: 929, parashiyot: 54}   # MAM/Sefaria versification

units:
  types: [verse, chapter, pericope, parasha]
  aggregations: [bma, mean]   # semantic unit aggregation (§6.2): `bsim units` writes {system}_{agg}

retrieval:
  k: 50
  neighbor_window: 2
  chunk_size: 2048
  device: cuda                # falls back to cpu if unavailable
  csls_neighbors: 10          # r(x) = mean cosine to this many nearest neighbours (*_csls systems)

lexical:
  bm25:
    k1: 1.2
    b: 0.75
  bigrams: true
  formulas:
    min_n: 3
    max_n: 6
    min_verses: 15            # T
    weight: 0.2               # alpha
  morph:                      # `structural` mode: BM25 / TF-IDF over word-shape n-grams (lexical/morph.py)
    max_n: 3
  domain:                     # bm25_domain / tfidf_domain over SDBH semantic domains (lexical/domains.py, §16.22)
    ancestor_weight: 0.0      # weight of each broader domain of a word's domain (0: the domain itself only; 0.5 was worse on dev)
    content_only: true        # leave out function words (not in a word's content_lemmas)
    expansion_weight: 0.75    # bm25_lemma_domain: lemma index + domain tokens at this weight (query / document expansion)

encoders:
  berel: dicta-il/BEREL_3.0
  bge_m3: BAAI/bge-m3
  batch_size: 64
  device: cuda                # falls back to cpu if unavailable
  systems:                    # system name -> encoder; `bsim embed --model {name}`
    berel_mean: {model: dicta-il/BEREL_3.0, pooling: mean}   # Transformer + mean pooling
    bge_m3: {model: BAAI/bge-m3, pooling: native}            # its own ST config: CLS + normalize (dense)
    berel_simcse: {model: models/berel-simcse, pooling: native}   # `bsim train-simcse` output
    berel_sup: {model: models/berel-sup, pooling: native}         # `bsim train-sup` output

train:
  simcse:
    base: dicta-il/BEREL_3.0
    output: berel-simcse        # under paths.models
    batch_size: 64
    lr: 3.0e-5
    epochs: 3
    dropout: 0.1                # hidden + attention dropout: the SimCSE noise
    warmup_ratio: 0.0
    logging_steps: 50
    select_metric: recall@10    # epoch chosen on dev
  supervised:
    base: dicta-il/BEREL_3.0    # used when init_from: base
    init_from: base             # a checkpoint under paths.models (e.g. berel-simcse) | base; dev ablation 2026-10
    output: berel-sup           # under paths.models
    batch_size: 256
    mini_batch_size: 32         # CachedMNRL chunk: bounds VRAM, not the effective batch
    lr: 2.0e-5
    warmup_ratio: 0.1
    epochs: 5
    dropout: 0.1                # hidden + attention dropout for init_from: base
    hard_negatives: true        # one BM25 hard negative per pair (train/negatives.py)
    hard_negative_rank_range: [5, 50]   # inclusive, after the ±neighbour filter
    extra_pairs: [openbible, etcbc]   # other golds' train-split pairs as extra positives: openbible | etcbc (train/pairs.py; adopted by supervision-exp, DESIGN.md §16.41)
    extra_min_votes: 5          # an OpenBible pair needs this many votes to be trained on
    eval_steps: 10              # dev evaluation every N optimizer steps (and each epoch end)
    logging_steps: 10
    select_metric: recall@10    # checkpoint chosen on dev

fusion:
  rrf_k: 60
  w_lex: 1.0                  # chosen on dev from w_lex_grid (`bsim fuse --tune`): verse nDCG@10 0.189
  w_sem: 1.0
  w_lex_grid: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0]
  unit_phrases: {chapter: 1.0}   # a third list: units ranked by the phrases their verses share, with this weight (chosen by `bsim unit-exp`, DESIGN.md §16.50)

links:
  cartesian_max: 3            # both sides <= this many verses -> Cartesian product (else positional/unit)

splits:
  ratios: {train: 0.75, dev: 0.10, test: 0.15}
  restarts: 50                # seeded random restarts + local search; the best fit is kept
  max_book_share: 0.35        # no single book may hold more of the dev/test pairs than this

eval:
  ks: [1, 5, 10, 50]           # recall@k
  rank_k: 10                  # MRR@k and nDCG@k cutoff
  worst_misses: 20            # missed gold pairs listed per system in the report
  unit_gold_min_links: 2      # m
  spot_checks: ["Psalms 14:1", "Exodus 20:2", "II Samuel 22:2"]   # top-5 printed in reports

labels:                       # your labels as a third gold set (`bsim eval-labels`, DESIGN.md §16.25)
  k: 10                       # a mode "finds" a labelled pair when either unit ranks the other within this
  min_pairs: 5                # AUC reported with at least this many real and not pairs
  split: dev                  # `bsim eval-labels` scores the verse pairs of this split (Sefaria split rule)

openbible:                    # `bsim eval-openbible`: second gold set, dev only (DESIGN.md §16.13)
  url: https://a.openbible.info/data/cross-references.zip   # CC-BY, openbible.info
  file: cross_references.txt
  min_votes: 5                # crowd votes a reference needs
  max_range: 10               # longest target range expanded to verses
  # KJV versification differs from the Hebrew here: references touching these chapters are dropped
  unsafe_chapters:
    Gen: [31, 32]
    Exod: [7, 8, 21, 22]
    Lev: [5, 6]
    Num: [16, 17, 29, 30]
    Deut: [12, 13, 22, 23, 28, 29]
    1Sam: [20, 21, 23, 24]
    2Sam: [18, 19]
    1Kgs: [4, 5, 18, 20, 22]
    2Kgs: [11, 12]
    1Chr: [5, 6, 12]
    2Chr: [1, 2, 13, 14]
    Neh: [3, 4, 9, 10]
    Job: [40, 41]
    Ps: all                   # psalm titles are counted as verses in Hebrew
    Eccl: [4, 5]
    Song: [6, 7]
    Isa: [8, 9, 63, 64]
    Jer: [8, 9]
    Ezek: [20, 21]
    Dan: [3, 4, 5, 6]
    Hos: [1, 2, 11, 12, 13, 14]
    Joel: [2, 3, 4]
    Jonah: [1, 2]
    Mic: [4, 5]
    Nah: [1, 2]
    Zech: [1, 2]
    Mal: [3, 4]

final_systems:                # chosen on dev in M8/M9
  lexical: bm25_lemma          # verse level
  unit_lexical: tfidf          # chapter / pericope / parasha (§5.1 unit TF-IDF)
  semantic: berel_sup_csls     # dev nDCG@10 0.150 (M8)
  unit_aggregation: bma        # bma | mean, chosen on dev
  fused: fused
  structural: bm25_morph       # grammatical shape (DESIGN.md §16.5): verse level
  unit_structural: tfidf_morph # chapter / pericope / parasha
  domain: bm25_domain          # semantic domains (DESIGN.md §16.22): shown as its own mode, not fused
  unit_domain: tfidf_domain    # chapter / pericope / parasha
  syntax: bm25_syntax          # BHSA clause shapes (DESIGN.md §16.26): its own mode, not fused
  unit_syntax: tfidf_syntax    # chapter / pericope / parasha

rerank:                       # `bsim train-rerank` / `bsim rerank`: cross-encoder over the fused verse lists (DESIGN.md §16.3)
  base: dicta-il/BEREL_3.0
  output: berel-rerank        # under paths.models
  system: fused_rerank        # artifacts/topk/verse/{system}.parquet
  depth: 50                   # fused candidates reranked per verse
  max_length: 256             # verse pair tokens
  negatives_per_query: 7      # from the anchor's own fused list
  pos_weight: null            # BCE positive weight (null = 1)
  batch_size: 32
  eval_batch_size: 128
  lr: 2.0e-5
  warmup_ratio: 0.1
  epochs: 3                   # dev nDCG@10 (alone) by epoch: 0.135 / 0.128 / 0.120 -> epoch 1 kept
  logging_steps: 50
  select_metric: ndcg@10      # epoch chosen on dev (cross-encoder alone)
  rrf_k: 60
  w_ce: 0.25                  # weight of the cross-encoder rank vs the fused rank; null = alone (dev grid)
  w_ce_grid: [0.25, 0.5, 1.0, 2.0, 4.0, null]

context:                      # `bsim embed-context`: verses encoded with their neighbours (DESIGN.md §16.21, dev experiment)
  encoder: berel_sup          # an encoders.systems entry; writes {encoder}_ctx and {encoder}_late
  window: 1                   # verses on each side
  scope: chapter              # chapter | book: neighbours never cross it
  max_seq_length: 256         # window tokens
  batch_size: 32

maxsim:                       # `bsim maxsim`: ColBERT-style token late interaction over the fused lists (DESIGN.md §16.21)
  encoders: [berel_sup, berel_mean]   # token vectors scored for the experiments
  encoder: berel_sup          # the one blended into {system}
  depth: 50                   # fused candidates scored per verse
  symmetric: true             # mean of MaxSim(a -> b) and MaxSim(b -> a)
  batch_size: 32              # source verses per GPU batch
  rrf_k: 60
  w: 0.5                      # weight of the MaxSim rank vs the fused rank; null = MaxSim alone
  system: fused_maxsim        # artifacts/topk/verse/{system}.parquet

retrieval_experiments:        # `bsim retrieval-exp`: contextual / MaxSim vs fused on dev (DESIGN.md §16.21)
  context_systems: [berel_sup_ctx_csls, berel_sup_late_csls]   # `bsim topk` lists of the context embeddings
  lexical_systems: [bm25_domain, bm25_lemma_domain, bm25_syntax]   # lexical lists over SDBH domains (§16.22) and BHSA clause shapes (§16.26): alone, in place of lexical, third list
  structural_systems: [bm25_syntax, bm25_morph_syntax]   # against final_systems.structural (§16.26)
  agreement_k: 10             # top list for the structural text-type agreement and overlap
  w_grid: [0.25, 0.5, 1.0]    # weight of a context list as a third RRF list
  maxsim_grid: [0.25, 0.5, 1.0, 2.0, null]
  metric: ndcg@10
  folds: 2                    # cross-fitting: weights chosen on one half of the queries, scored on the other
  bootstrap_reps: 10000
  seed: 13

supervision_experiments:      # `bsim supervision-exp`: more supervision for the encoder, dev only (DESIGN.md §16.41)
  baseline: berel_sup         # the encoders.systems entry in use
  variants:                   # name -> train-sup overrides; each trains models/{train.supervised.output}-{name}
    seed14: {seed: 14, extra_pairs: []}   # Sefaria pairs only, another seed: what a retrain alone moves
    etcbc: {extra_pairs: [etcbc]}       # (variants were scored against the Sefaria-only model, now models/berel-sup-sefaria)
    openbible: {extra_pairs: [openbible]}
    both: {extra_pairs: [openbible, etcbc]}
  noise: seed14               # its OpenBible gain, either way, is the bar a variant must clear (adoption rule, fixed in advance)
  golds: [sefaria, openbible, etcbc]
  metric: ndcg@10
  bootstrap_reps: 10000
  seed: 13

encoder_experiments:          # `bsim encoder-exp`: newer encoders against the model in use, dev only (DESIGN.md §16.48)
  baseline: berel_sup         # the encoders.systems entry in use
  trained:                    # name -> train-sup overrides: same recipe, pairs and seed from another base; writes models/{name}-sup
    dictabert: {base: dicta-il/dictabert}          # modern Hebrew BERT-base (Dicta, CC BY 4.0)
    dictabert_large: {base: dicta-il/dictabert-large, mini_batch_size: 16}   # BERT-large; the CachedMNRL chunk bounds VRAM only
  zero_shot:                  # name -> encoder spec, inference only (multilingual embedders, never trained here)
    e5_large: {model: intfloat/multilingual-e5-large, pooling: native, prompt: "query: "}
    qwen3_06b: {model: Qwen/Qwen3-Embedding-0.6B, pooling: native, prompt: "Instruct: Given a verse of the Hebrew Bible, retrieve other verses related to it\nQuery:"}
  reference: bge_m3           # the zero-shot system already built: the zero-shot candidates are also compared with it (semantic list)
  noise: seed14               # supervision-exp's reseeded retrain: its largest fused gain over the golds, either way, is the bar
  golds: [sefaria, openbible, etcbc]
  metric: ndcg@10
  bootstrap_reps: 10000
  seed: 13

unit_experiments:             # `bsim unit-exp`: a third fusion list for chapters and pericopes, dev only (DESIGN.md §16.50); fixed before the first run
  unit_types: [chapter, pericope]
  sequences_max_q: [null, 0.2]   # family "sequences": the aligned verse pairs of every chain (null) or of chains with q <= 0.2, by their weight
  hits_depth: [10, 50]        # family "hits": each verse's fused top-N verses, weight (N + 1 - rank) / N; neighbours dropped
  w_grid: [0.25, 0.5, 1.0]    # the family's list as a third RRF list beside the unit lexical and semantic lists
  golds: [sefaria, openbible, etcbc]   # unit gold of each: unit pairs sharing >= eval.unit_gold_min_links dev verse pairs (Sefaria: + its unit links)
  metric: ndcg@10
  folds: 2                    # cross-fitting, as retrieval-exp
  bootstrap_reps: 10000
  seed: 13

phrases:                      # `bsim phrases`: shared phrases by local alignment (DESIGN.md §16)
  candidate_rank: 50          # align pairs within the final lexical verse top-k
  mismatch: 1.5               # Smith-Waterman penalties; a match scores idf x formula weight
  gap: 1.5
  min_tokens: 3               # matched lemma tokens
  min_score: 14

sequences:                    # `bsim sequences`: same-order parallel passages (DESIGN.md §16.7)
  candidate_rank: 20          # verse pairs within either verse's fused top-N; weight (N+1-rank)/N
  max_step: 3                 # a chain advances 1..max_step verses on each side
  gap: 0.25                   # cost per skipped verse (either side)
  min_pairs: 4                # shortest chain kept
  directions: [forward, reverse, mixed]   # same order; mirrored (A B C ~ C' B' A'); same scene reordered
  max_overlap: 0.5            # a reverse / mixed chain sharing this share of pairs with a kept chain is dropped
  null_reps: 20               # chapter-internal verse shuffles for q-values
  seed: 13

diffs:                        # `bsim diffs`: word-level changes inside parallel sequences (DESIGN.md §16.8)
  max_q: 0.05                 # sequences aligned word by word
  same_chapter: false         # include repeats inside one chapter (lists: Num 7, Num 29)
  min_shared: 0.3             # diff a verse pair only if this share of the shorter verse keeps its lemma
  rewrite_min_count: 2        # a book pair's change listed as a rewrite when seen this often
  match: 2                    # Needleman-Wunsch scores over word lemma keys
  mismatch: 1
  gap: 1

parallelism:                  # `bsim parallelism`: verse halves from the te'amim (DESIGN.md §16.9)
  encoder: null               # encoders.systems entry for the cola; null = the final semantic system's base
  C: 1.0                      # logistic regression (standardized cos / shared / shape / balance)
  train_positive: [Ps, Prov, Job]            # poetic accent system
  train_negative: [Gen, Exod, Lev, Num, Deut, Josh, Judg, 1Sam, 2Sam, 1Kgs, 2Kgs, 1Chr, 2Chr, Ezra, Neh, Esth, Ruth]
  known_poems: ["Gen 49", "Exod 15", "Num 23", "Num 24", "Deut 32", "Deut 33", "Judg 5", "1Sam 2", "2Sam 1", "2Sam 22"]
  min_chapter_verses: 6       # chapters ranked in the known-poem check / the API ranking
  parallel_at: 0.5            # a verse counts as parallel at this probability
  pair_min_count: 3           # word pairs across parallel members: shortest count listed
  pair_min_chapters: 3        # ... and the fewest chapters it must occur in (keeps list formulas out)
  typing_check: {Prov: [10, 15]}   # chapters expected most antithetic (the check D49's negation cue failed)
  typing_null_reps: 50        # second halves shuffled between parallel lines: the antithetic share by chance
  typing_max_pairs: 6         # word pairs kept per verse to show why it was typed
  typing_min_parallel: 10     # /parallelism?sort=antithetic: parallel verses a unit needs to be ranked
  seed: 13

wordplay:                     # `bsim wordplay`: sound-alike words close together (DESIGN.md §16.10)
  min_letters: 3              # skeleton length (consonants without ו / י vowel letters)
  window: 8                   # words apart (verse boundaries crossed, chapters not)
  distance: 0.15              # score cost per word between the two
  skip_pos: [C, R, T, P]      # conjunctions, prepositions, particles, pronouns
  skip_proper: true           # proper nouns and gentilics (name lists are built alike)
  same_vowels: true           # the two words must share their vowel pattern
  null_reps: 20               # chapter-internal word-order shuffles for q-values
  seed: 13

acrostics:                    # `bsim acrostics`: alphabetic acrostics, whole or broken (DESIGN.md §16.15)
  unit_type: chapter
  granularities: [verse, colon]   # line units: verse starts, colon starts (te'amim pauses)
  max_line_gap: 8             # lines between successive letters (Ps 119: 8 verses per letter)
  missing_penalty: 1.0        # score cost of a skipped letter
  null_reps: 9999             # line-order shuffles per chapter (p resolution 1e-4)
  null_screen: 199            # shuffles first; all null_reps only if fewer than screen_hits reach the score
  screen_hits: 10
  report_q: 0.05              # reported as significant at this BH q
  seed: 13
  known: ["Ps 9", "Ps 25", "Ps 34", "Ps 37", "Ps 111", "Ps 112", "Ps 119", "Ps 145", "Prov 31", "Lam 1", "Lam 2", "Lam 3", "Lam 4", "Nah 1"]

typescenes:                   # `bsim typescenes`: recurring plot skeletons (DESIGN.md §16.20)
  unit_type: pericope
  max_verses: 80              # longer pericopes are not aligned
  max_df: 0.15                # verbs in more than this share of pericopes are left out
  min_shared_idf: 8.0         # candidate pair: shared verbs' idf at least this
  max_partners: 15            # strongest candidate partners kept per pericope
  mismatch: 1.0               # Smith-Waterman over verb lemmas; a match scores its idf
  gap: 0.5
  min_matches: 4              # aligned verbs
  null_reps: 5                # verb-order shuffles inside pericopes for q-values
  seed: 13

sound:                        # `bsim sound`: alliteration and rhyme (DESIGN.md §16.19)
  min_words: 3                # cola with fewer content words are not scored for alliteration
  shape_smoothing: 50         # pseudo-count pulling a word shape's sound rates towards the overall ones
  min_count: 3                # words sharing an initial sound
  min_run: 3                  # consecutive cola ending alike

entities:                     # `bsim entities`: people and places, who appears with whom (DESIGN.md §16.11)
  skip_lemmas: ["3068", "3069", "3050"]   # divine names (OSHB tags them Np)
  dominance: 1.5              # person / place when one cue score is this many times the other
  min_cue: 0.05               # below this for both: unclear
  min_together: 2             # verses two names must share to be linked
  partners: 25                # strongest links kept per name (G²)

senses:                       # `bsim senses`: a word's senses and uses across the canon (DESIGN.md §16.23)
  encoder: berel_mean         # encoders.systems entry for the word vectors (pretrained BEREL: not tuned to verse similarity)
  max_seq_length: 128
  batch_size: 64
  groups:                     # corpus groups compared (every book in exactly one)
    torah: [Gen, Exod, Lev, Num, Deut]
    former_prophets: [Josh, Judg, 1Sam, 2Sam, 1Kgs, 2Kgs]
    latter_prophets: [Isa, Jer, Ezek, Hos, Joel, Amos, Obad, Jonah, Mic, Nah, Hab, Zeph, Hag, Zech, Mal]
    poetry: [Ps, Prov, Job]
    scrolls: [Song, Ruth, Lam, Eccl, Esth]
    late: [Dan, Ezra, Neh, 1Chr, 2Chr]
  min_count: 50               # occurrences of a lemma (as a word's only content lemma, names left out)
  min_per_group: 10           # ... in each of at least
  min_groups: 2               # ... this many groups
  max_k: 4                    # contextual-use clusters per lemma: k in 2..max_k by silhouette
  silhouette_sample: 1000
  min_sense_count: 5          # SDBH meanings compared need this many tagged occurrences (at least two meanings)
  null_reps: 200              # group labels shuffled over the occurrences
  collocates: 6               # Hebrew collocates describing a cluster
  collocate_min_verses: 3
  examples: 3                 # occurrences shown per cluster / meaning
  seed: 13

borrowing:                    # `bsim borrowing`: which side of a parallel looks like the borrower (DESIGN.md §16.27)
  min_ops: 2                  # a diff-based sign needs this many changes of its kind in a sequence
  select_p: 0.05              # a sign votes when it matches the known directions (sign test p below this)
  # literature direction of each `dating` feature: +1 = a higher rate looks later
  language_signs: {lbh_lexemes: 1, anokhi: -1, inf_abs: -1, et_suffix: -1, directional_he: -1, cohortative_wayyiqtol: 1, david_plene: 1}
  known:                      # directions most scholars accept: the check (source -> borrower)
    - {source: 1Sam, target: 1Chr}
    - {source: 2Sam, target: 1Chr}
    - {source: 1Kgs, target: 2Chr}
    - {source: 2Kgs, target: 2Chr}
    - {source: Gen, target: 1Chr}     # genealogies of 1 Chr 1
    - {source: Josh, target: 1Chr}    # Levitical cities, 1 Chr 6
    - {source: Ps, target: 1Chr}      # Ps 96 / 105 / 106 in 1 Chr 16
    - {source: 2Kgs, target: Jer}     # 2 Kgs 24–25 in Jer 52
    - {source: Exod, target: Deut}    # the Decalogue

dating:                       # `bsim dating`: a Late Biblical Hebrew profile per chapter (DESIGN.md §16.24)
  early: [Gen, Exod, Lev, Num, Deut, Josh, Judg, 1Sam, 2Sam, 1Kgs, 2Kgs]   # Standard Biblical Hebrew (training)
  late: [1Chr, 2Chr, Ezra, Neh, Esth, Dan]   # undisputed Late Biblical Hebrew (training; Aramaic words left out)
  poetic: [Ps, Prov, Job, Song, Lam]         # flagged out of domain: the model is calibrated on prose
  poetic_share: 0.5           # ... and any chapter with this share of parallel verse halves (poems inside prose)
  drivers: 3                  # features listed per chapter as pushing its score up
  lexemes: [4438, 107, 1002, 4082, 1881, 6901, 948, 3187, 3791, 3664, 2165, 1595, 7980]   # מלכות אגרת בירה מדינה דת קבל בוץ יחש כתב כנס זמן גנזים שלט
  min_words: 150              # Hebrew words a chapter needs to be scored
  shrink: 20                  # pseudo-counts pulling a chapter's rates towards the training mean
  C: 1.0                      # logistic regression (standardized features)
  synoptic:                   # parallels scored by models trained without these books
    a: [1Sam, 2Sam, 1Kgs, 2Kgs]
    b: [1Chr, 2Chr]
    max_q: 0.05               # parallel sequences (`bsim sequences`) used
    min_words: 40             # Hebrew words on each side
    examples: 8

seams:                        # `bsim seams`: where a book's style changes (DESIGN.md §16.12)
  block_words: 600            # words compared on each side of a verse boundary
  null_reps: 50               # verse-order shuffles per book (threshold: 95th pct of the maxima)
  top_features: 6             # features listed per seam
  seed: 13

structure:                    # `bsim structure` + /structure: inclusio, chiasm, Leitwort (DESIGN.md §16.2)
  unit_types: [chapter, pericope, parasha]
  max_verses: 200             # larger units are not scored (and /structure refuses them)
  min_verses_inclusio: 4
  min_verses_chiasm: 5        # and at least 2 non-adjacent mirror pairs
  samples: 2000               # chiasm null: random same-distance pairs
  seed: 13
  echoes: 8                   # strongest non-adjacent verse pairs shown per unit
  leitwort_min_count: 3
  leitwort_top: 12
  leitwort_skip_pos: [C, R, T, P]   # conjunctions, prepositions, particles, pronouns
  leitwort_moduli: [6, 7, 8, 9, 10, 11, 12, 13]   # multiples-of-m check (7 and 10 + controls)

map:                          # `bsim map`: layout, clusters, book affinity (DESIGN.md §16.4)
  clusters: {chapter: 20, pericope: 30, parasha: 8}   # KMeans k per unit type (also the types mapped)
  perplexity: 30              # t-SNE (capped for small sets)
  label_lemmas: 5             # cluster label: top G² lemmas
  affinity_rank: 10           # cross-book verse pairs within the fused top-N
  examples: 10                # strongest verse pairs kept per book pair

network:                      # `bsim network`: echoes between passages, central passages, communities (DESIGN.md §16.17)
  unit_types: [chapter, pericope]
  edge_rank: 10               # edge when either unit has the other in its fused top-N; weight (N+1-rank)/N
  skip_adjacent: true         # no edges between consecutive units of one book
  damping: 0.85               # PageRank
  resolution: 3.0             # Louvain (higher: smaller communities; 1 gives genre-sized ones)
  label_lemmas: 5             # community label: top G² lemmas
  seed: 13

echoes:                       # `bsim echoes`: a direction on the cross-book echoes (DESIGN.md §16.36)
  language_gap: 0.3           # the language layer directs a pair whose late-profile scores differ this much
  explicit_weight: 1.0        # weight of a cited / borrowed chapter pair the network does not link
  min_check: 10               # a check with fewer decided cases is reported as underpowered
  max_cycle: 4                # book cycles (cited / borrowed layers) listed up to this length

stylometry:                  # `bsim stylometry`: style profiles (DESIGN.md §16.6)
  mfw: 100                    # most frequent content lemmas used as features
  min_words: 150              # chapters shorter than this are not projected
  top_features: 8             # most over- / under-used features kept per book
  axis_features: 6            # loadings listed per principal axis

voices:                       # `bsim voices`: does a speaker have a style of their own? (DESIGN.md §16.28)
  min_words: 300              # attributed speech words a speaker needs to be profiled
  exclude: ["3478"]           # proper names of peoples, not persons (ישראל); common-noun speakers are never profiled
  shuffles: 999               # speaker labels permuted over the speech clauses of each book
