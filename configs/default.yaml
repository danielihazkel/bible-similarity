    - {books: [Genesis, Deuteronomy], name: torah, unit: letters, value: 304805, source: printed}   # at the end of Deuteronomy in the Rabbinic Bible
    - {books: [Joshua, Malachi], name: prophets, unit: verses, value: 9294, source: masorah}
    - {books: [Psalms, II Chronicles], name: writings, unit: verses, value: 8064, source: masorah}
