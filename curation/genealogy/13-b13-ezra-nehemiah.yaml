  - kind: descendant
    child: "Ezra@Ezr.7.1-Neh"
    readings:
      - {parent: "Seraiah@2Ki.25.18-Jer", kind: descendant, proof: [Ezra 7:1]}
    note:
      en: "\"עזרא בן שריה\" (Ezra 7:1). Seraiah the chief priest was put to death at Riblah (II Kings 25:18-21) and his son Jehozadak went into exile (I Chronicles 5:40-41); Ezra went up in the seventh year of Artaxerxes (Ezra 7:7-8), after Jehozadak's son Jeshua had returned (Ezra 3:2)."
      he: "„עזרא בן שריה” (עזרא ז:א). שריה כהן הראש הומת ברבלה (מלכים ב כה:יח–כא) ובנו יהוצדק הלך בגולה (דברי הימים א ה:מ–מא); עזרא עלה בשנת שבע לארתחשסתא (עזרא ז:ז–ח), אחרי שעלה ישוע בן יוצדק (עזרא ג:ב)."
  - kind: descendant
    child: "Azariah@1Ch.6.10-Ezr"
    readings:
      - {parent: "Johanan@1Ch.6.9-", proof: [I Chronicles 5:36]}
      - {parent: "Meraioth@1Ch.6.6-Neh", kind: descendant, proof: [Ezra 7:3]}
    note:
      en: "\"ויוחנן הוליד את עזריה\" (I Chronicles 5:36); \"בן אמריה בן עזריה בן מריות\" (Ezra 7:3), which leaves out the six names from Amariah to Johanan of I Chronicles 5:33-36."
      he: "„ויוחנן הוליד את עזריה” (דברי הימים א ה:לו); „בן אמריה בן עזריה בן מריות” (עזרא ז:ג), בלי ששת השמות מאמריה עד יוחנן שבדברי הימים א ה:לג–לו."
  - kind: descendant
    child: "Mahli@Exo.6.19-Ezr"
    readings:
      - {parent: "Merari@Gen.46.11-Ezr", proof: [Exodus 6:19, Numbers 3:20, I Chronicles 6:4]}
      - {parent: "Levi@Gen.29.34-Rev", kind: descendant, proof: [Ezra 8:18]}
    note:
      en: "\"ובני מררי מחלי ומושי\" (Exodus 6:19); \"מבני מחלי בן לוי בן ישראל\" (Ezra 8:18)."
      he: "„ובני מררי מחלי ומושי” (שמות ו:יט); „מבני מחלי בן לוי בן ישראל” (עזרא ח:יח)."
  - kind: descendant
    child: "Johanan@Neh.12.11-"
    readings:
      - {parent: "Joiada@Neh.12.10-", proof: [Nehemiah 12:11, Nehemiah 12:22]}
      - {parent: "Eliashib@Neh.12.10-", kind: descendant, proof: [Nehemiah 12:23]}
    note:
      en: "\"ויוידע הוליד את יונתן ויונתן הוליד את ידוע\" (Nehemiah 12:11) and \"אלישיב יוידע ויוחנן וידוע\" (12:22) put him between Joiada and Jaddua; \"יוחנן בן אלישיב\" (12:23), his grandfather."
      he: "„ויוידע הוליד את יונתן ויונתן הוליד את ידוע” (נחמיה יב:יא) ו„אלישיב יוידע ויוחנן וידוע” (יב:כב) שמים אותו בין יוידע לידוע; „יוחנן בן אלישיב” (יב:כג), אבי אביו."
  - kind: descendant
    child: "Jeroham@1Ch.9.12-Neh"
    readings:
