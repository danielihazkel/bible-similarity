      - {parent: "Pashhur@1Ch.9.12-Neh", kind: descendant, proof: [I Chronicles 9:12]}
    note:
      en: "\"ועדיה בן ירחם בן פלליה בן אמצי בן זכריה בן פשחור בן מלכיה\" (Nehemiah 11:12); \"ועדיה בן ירחם בן פשחור בן מלכיה\" (I Chronicles 9:12)."
      he: "„ועדיה בן ירחם בן פלליה בן אמצי בן זכריה בן פשחור בן מלכיה” (נחמיה יא:יב); „ועדיה בן ירחם בן פשחור בן מלכיה” (דברי הימים א ט:יב)."
