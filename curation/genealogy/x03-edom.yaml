#    father named (Hadar is drawn beside Mehetabel), Mezahab the father of Hadar's wife's mother.
#  - Elon and Beeri are Hittites (Gen 26:34, 36:2), like Zohar (Gen 23:8), who has no tribe.
#  - TIPNR's husband of Matred has no link left (block 03 rejected both).
# Kept under Esau: the chiefs of Gen 36:40-43, "אלופי עשו למשפחתם" (36:40, 43), and Hadad
