conflicts:
  - kind: bible
    child: "Kish@1Sa.9.1-Act"
    readings:
      - {parent: "Abiel@1Sa.9.1-1Ch", proof: [I Samuel 9:1, I Samuel 14:51]}
      - {parent: "Ner@1Sa.14.50-1Ch", proof: [I Chronicles 8:33, I Chronicles 9:39]}
    note:
      en: "\"קיש בן אביאל\" (I Samuel 9:1, 14:51); \"ונר הוליד את קיש\" (I Chronicles 8:33, 9:39). I Chronicles 8:30 and 9:36 also list a Kish and a Ner among the sons of Jeiel of Gibeon, whom TIPNR takes for Abiel."
      he: "„קיש בן אביאל” (שמואל א ט:א, יד:נא); „ונר הוליד את קיש” (דברי הימים א ח:לג, ט:לט). בדה״א ח:ל ובט:לו נמנים קיש ונר בין בני יעיאל אבי גבעון, ש־TIPNR מזהה עם אביאל."
  - kind: bible
    child: "Abigail@2Sa.17.25-1Ch"
    readings:
      - {parent: "Jesse@Rut.4.17-Rom", proof: [I Chronicles 2:13, I Chronicles 2:16]}
      - {parent: "Nahash@2Sa.17.25", proof: [II Samuel 17:25]}
    note:
      en: "Amasa's mother is \"אביגל בת נחש אחות צרויה\", her husband \"יתרא הישראלי\" (II Samuel 17:25); I Chronicles 2:16-17 counts Zeruiah and Abigail as sisters of Jesse's sons and calls Amasa's father \"יתר הישמעאלי\". TIPNR makes Nahash Jesse's wife; the text does not say so."
      he: "„אביגל בת נחש אחות צרויה”, ובעלה „יתרא הישראלי” (שמואל ב יז:כה); בדה״א ב:טז–יז צרויה ואביגיל אחיות בני ישי, ואבי עמשא „יתר הישמעאלי”. ב־TIPNR נחש היא אשת ישי, והכתוב אינו אומר זאת."
  - kind: descendant
    child: "Mephibosheth@2Sa.4.4-1Ch"
    readings:
      - {parent: "Jonathan@1Sa.13.2-1Ch", proof: [II Samuel 4:4, II Samuel 9:6]}
      - {parent: "Saul@1Sa.9.2-Act", kind: descendant, proof: [II Samuel 9:7, II Samuel 19:25]}
    note:
      en: "Mephibosheth is Jonathan's son (II Samuel 4:4, 9:6); 19:25 calls him \"מפבשת בן שאול\", and 9:7 calls Saul \"אביך\", his grandfather."
      he: "מפיבשת בן יהונתן (שמואל ב ד:ד, ט:ו); ביט:כה „מפבשת בן שאול”, ובט:ז שאול „אביך”, אבי אביו."
