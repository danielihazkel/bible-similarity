#    (Josh 16:10); Jabin and Jobab (Josh 11:1-3, Judg 4:2 "מלך כנען"); Adoni-bezek (Judg 1:4-5).
#  - TIPNR's four unnamed ancestors of Eli (I Kgs 2:27) keep Levi: they have no link (block 09).
