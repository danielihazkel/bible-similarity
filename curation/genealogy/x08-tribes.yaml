# Kept, the tribe or nation stated, or carried for a son whose it is:
#  - the chieftains' fathers of Num 1 (but Zurishaddai), Machi (Num 13:15), Aphiah, Rimmon and
#    Bichri "ימיני", Senaah, Elimelech "מבית לחם יהודה", Jephunneh (step 4), the Netophathites;
#  - the priests and gatekeepers of Neh 11-12, Jehoiada "הכהן";
#  - the kings and their fathers: of Ammon, Assyria, Cush, Egypt, Moab (Zippor carries Balak,
#    "מלך למואב", Num 22:4), Aram, Midian (Jethro "כהן מדין"), Edom (step 3); Israel's kings
#    and their fathers whose tribe is not given (Zimri, Omri, Nimshi, Gadi, Remaliah);
#  - Canaan: the kings of Sodom, Gomorrah, Admah and Zeboiim, within "גבול הכנעני" (Gen 10:19);
