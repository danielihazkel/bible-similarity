conflicts:
  - kind: bible
    child: "Maacah@1Ki.15.2-2Ch"
    readings:
      - {parent: "Absalom@2Sa.3.3-Psa", role: father, proof: [I Kings 15:2, II Chronicles 11:20, II Chronicles 11:21]}
      - {parent: "Uriel@2Ch.13.2", proof: [II Chronicles 13:2]}
    note:
      en: "Abijam's mother is \"מעכה בת אבישלום\" (I Kings 15:2), \"מעכה בת אבשלום\" (II Chronicles 11:20-21), and \"מיכיהו בת אוריאל מן גבעה\" (II Chronicles 13:2). TIPNR makes her the daughter of Uriel and of Absalom's daughter Tamar; no verse says so."
      he: "אם אבים „מעכה בת אבישלום” (מלכים א טו:ב), „מעכה בת אבשלום” (דברי הימים ב יא:כ–כא), ו„מיכיהו בת אוריאל מן גבעה” (דה״ב יג:ב). ב־TIPNR היא בת אוריאל ובת תמר בת אבשלום, ואין כתוב שאומר זאת."
  - kind: descendant
    child: "Athaliah@2Ki.8.26-2Ch"
    readings:
      - {parent: "Ahab@1Ki.16.28-Mic", proof: [II Kings 8:18, II Kings 8:26, II Chronicles 21:6]}
      - {parent: "Omri@1Ki.16.16-Mic", kind: descendant, proof: [II Kings 8:26, II Chronicles 22:2]}
    note:
      en: "Jehoram's wife is \"בת אחאב\" (II Kings 8:18, II Chronicles 21:6); Ahaziah's mother is \"עתליהו בת עמרי\" (II Kings 8:26, II Chronicles 22:2), Ahab's father."
      he: "אשת יהורם „בת אחאב” (מלכים ב ח:יח, דה״ב כא:ו); אם אחזיהו „עתליהו בת עמרי” (מלכים ב ח:כו, דה״ב כב:ב), אבי אחאב."
  - kind: descendant
    child: "Jehu@1Ki.19.16-Hos"
    readings:
      - {parent: "Jehoshaphat@2Ki.9.2-", proof: [II Kings 9:2, II Kings 9:14]}
      - {parent: "Nimshi@1Ki.19.16-2Ch", kind: descendant, proof: [I Kings 19:16, II Kings 9:20]}
    note:
      en: "\"יהוא בן יהושפט בן נמשי\" (II Kings 9:2, 14); \"יהוא בן נמשי\" (I Kings 19:16, II Kings 9:20), his grandfather."
      he: "„יהוא בן יהושפט בן נמשי” (מלכים ב ט:ב, יד); „יהוא בן נמשי” (מלכים א יט:טז, מלכים ב ט:כ), אבי אביו."
  - kind: descendant
    child: "Azariah@1Ki.4.2-1Ch"
    readings:
      - {parent: "Ahimaaz@2Sa.15.27-1Ch", proof: [I Chronicles 5:35]}
      - {parent: "Zadok@2Sa.8.17-Ezk", kind: descendant, proof: [I Kings 4:2]}
    note:
      en: "\"עזריהו בן צדוק הכהן\" (I Kings 4:2); \"ואחימעץ הוליד את עזריה\" (I Chronicles 5:35), Zadok's grandson, as TIPNR takes him."
      he: "„עזריהו בן צדוק הכהן” (מלכים א ד:ב); „ואחימעץ הוליד את עזריה” (דה״א ה:לה), נכד צדוק, כפי ש־TIPNR מזהה אותו."
