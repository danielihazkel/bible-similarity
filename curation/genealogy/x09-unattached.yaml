# §16.63, docs/genealogy/PROGRESS.md). The sweep: the 1,076 people under "unattached", each name
# followed within a few words by a gentilic, "מלך X", "מבני X" or "הכהן" / "הלוי"; and the
# priests' and Levites' lists of Ezra 8, 10 and Nehemiah 9-12.
block: x09-unattached
status: reviewed
# Left: a gentilic of a place, not a people ("הגלעדי", "הכרמלי", "הענתותי", Barak "מקדש נפתלי");
# a nation with no eponym in the tree (Babylon, Persia, the Kenites, the Ishmaelites, the Horonite
# Sanballat); a gentilic on someone else in the verse (Eliam, Uriah's father-in-law; Elnaam, beside
# Ithmah "המואבי"); Jether "הישמעאלי" / "הישראלי" (block 08); Abihail, Mordecai's "דד" (paternal or
# maternal); Ezra's messengers (Ezra 8:16-17) and the men beside Ezra (Neh 8:4), not called
# priests or Levites; Neh 8:7, where "והלוים" may or may not be the names before it; the singers
# and gatekeepers of Ezra 10:24, listed apart from the Levites (10:23). Hammath the Kenite "אבי בית
# רכב" (I Chr 2:55) keeps TIPNR's Judah, in whose list Chronicles puts the Kenites; the Simeonite
# princes of I Chr 4:34-42 stay on Simeon.
