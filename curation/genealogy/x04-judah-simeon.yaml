    child: "Achsah@Jos.15.16-Jdg"
    readings:
      - {parent: "Caleb@Num.13.6-1Ch", proof: [Joshua 15:16, Judges 1:12]}
      - {parent: "Caleb@1Ch.2.9-", proof: [I Chronicles 2:49]}
    note:
      en: "Achsah is the daughter of Caleb son of Jephunneh (Joshua 15:13-17) and of Caleb son of Hezron (I Chronicles 2:18, 49): either the two Calebs are one man, or each had a daughter Achsah."
      he: "עכסה היא בת כלב בן יפנה (יהושע טו:יג–יז) ובת כלב בן חצרון (דברי הימים א ב:יח, מט): או ששני הכלבים איש אחד, או שלכל אחד בת בשם עכסה."
  - kind: bible
    child: "Ethan@1Ch.2.6-"
    readings: &zerah
      - {parent: "Zerah@Gen.38.30-Mat", proof: [I Chronicles 2:6]}
      - {parent: "Mahol@1Ki.4.31", proof: [I Kings 5:11]}
    note: &zerah-note
      en: "I Chronicles 2:6 lists Ethan, Heman, Calcol and Dara among the sons of Zerah; I Kings 5:11 names Ethan the Ezrahite, Heman, Calcol and Darda, sons of Mahol. If בני זרח means descendants, Mahol stands between."
      he: "דברי הימים א ב:ו מונה את איתן, הימן, כלכל ודרע בבני זרח; מלכים א ה:יא מזכיר את איתן האזרחי, הימן, כלכל ודרדע, בני מחול. אם „בני זרח” הם צאצאיו, מחול ביניהם."
  - {kind: bible, child: "Heman@1Ch.2.6", readings: *zerah, note: *zerah-note}
  - {kind: bible, child: "Calcol@1Ch.2.6", readings: *zerah, note: *zerah-note}
  - {kind: bible, child: "Dara@1Ch.2.6", readings: *zerah, note: *zerah-note}
