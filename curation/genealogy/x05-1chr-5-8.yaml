  # Korah's line: "קרח בנו אסיר בנו / אלקנה בנו ואביסף בנו ואסיר בנו" (6:7-8) as a chain, against
  # Korah's three sons (Ex 6:24) and "אסיר בן אביסף בן קרח" (6:22)
  - kind: bible
    child: "Elkanah@Exo.6.24-1Ch"
    readings:
      - {parent: "Korah@Exo.6.21-Jud", proof: [Exodus 6:24]}
      - {parent: "Assir@Exo.6.24-1Ch", proof: [I Chronicles 6:7, I Chronicles 6:8]}
    note: &korah
      en: "\"ובני קרח אסיר ואלקנה ואביאסף\" (Exodus 6:24) makes Elkanah and Ebiasaph Korah's sons, and \"אסיר בן אביסף בן קרח\" (I Chronicles 6:22) agrees for Ebiasaph. Read as a chain like the verses after it, \"קרח בנו אסיר בנו אלקנה בנו ואביסף בנו ואסיר בנו\" (6:7-8) makes Elkanah Assir's son and Ebiasaph Elkanah's."
      he: "„ובני קרח אסיר ואלקנה ואביאסף” (שמות ו:כד) עושה את אלקנה ואביסף בני קרח, ו„אסיר בן אביסף בן קרח” (דברי הימים א ו:כב) מסכים לגבי אביסף. בקריאה כשרשרת, כמו הפסוקים שאחריו, „קרח בנו אסיר בנו אלקנה בנו ואביסף בנו ואסיר בנו” (ו:ז–ח) עושה את אלקנה בן אסיר ואת אביסף בן אלקנה."
  - kind: bible
    child: "Ebiasaph@Exo.6.24-1Ch"
    readings:
      - {parent: "Korah@Exo.6.21-Jud", proof: [Exodus 6:24, I Chronicles 6:22]}
      - {parent: "Elkanah@Exo.6.24-1Ch", proof: [I Chronicles 6:8]}
    note: *korah
