conflicts:
  - kind: bible
    child: "Meshullam@Neh.11.7"
    readings:
      - {parent: "Joed@Neh.11.7", proof: [Nehemiah 11:7]}
      - {parent: "Hodaviah@1Ch.9.7", proof: [I Chronicles 9:7]}
    note:
      en: "Sallu's father Meshullam is \"בן יועד בן פדיה\" (Nehemiah 11:7) or \"בן הודויה בן הסנאה\" (I Chronicles 9:7)."
      he: "משלם אבי סלוא הוא „בן יועד בן פדיה” (נחמיה יא:ז) או „בן הודויה בן הסנאה” (דברי הימים א ט:ז)."
  - kind: bible
    child: "Mica@1Ch.9.15-Neh"
    readings:
      - {parent: "Zichri@1Ch.9.15-Neh", proof: [I Chronicles 9:15, Nehemiah 11:17]}
      - {parent: "Zaccur@1Ch.25.2-Neh", proof: [Nehemiah 12:35]}
    note:
      en: "\"מיכא בן זכרי בן אסף\" (I Chronicles 9:15; \"זבדי\" in Nehemiah 11:17) and \"מיכיה בן זכור בן אסף\" (Nehemiah 12:35): three forms of the name of Asaph's son, perhaps one man."
      he: "„מיכא בן זכרי בן אסף” (דברי הימים א ט:טו; „זבדי” בנחמיה יא:יז) ו„מיכיה בן זכור בן אסף” (נחמיה יב:לה): שלוש צורות לשם בן אסף, ואולי איש אחד."
