[project]
name = "bsim"
version = "0.1.0"
description = "Top-k similar verses, chapters, parashiyot and pericopes in the Hebrew Bible"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.6",
    "transformers>=4.45",
    "sentence-transformers>=3.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "lxml>=5.3",
    "requests>=2.32",
    "typer>=0.12",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
bsim = "bsim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsim"]

# GTX 1080 Ti (Pascal, sm_61): cu128+ wheels dropped Pascal, so torch must come from cu126.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
