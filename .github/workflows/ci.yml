# Checks every push and pull request without the data, models or GPU (DESIGN.md §13):
# ruff + pytest, the viewer's lint / type check / unit tests, the generated API types being up to
# date, and the Playwright end-to-end tests against `bsim fixture-serve` (a tiny synthetic DB).
# Three jobs run side by side; the end-to-end tests are split over three runners (`--shard`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Python dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest

  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Python dependencies
        run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Viewer dependencies
        working-directory: web
        run: npm ci
      - name: Viewer lint and type check
        working-directory: web
        run: npm run lint
      - name: Viewer unit tests
        working-directory: web
        run: npm test
      - name: Generated API types up to date
        working-directory: web
        run: npm run check:api
      - name: Viewer build
        working-directory: web
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Python dependencies
        run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Viewer dependencies
        working-directory: web
        run: npm ci
      - name: Viewer build
        working-directory: web
        run: npm run build
      - name: Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (fixture DB), shard ${{ matrix.shard }} of 3
        working-directory: web
        run: npm run e2e:fixture -- --shard ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report
          retention-days: 7
